<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-partialdemolish,#plan.tool-floorrect,#plan.tool-floorpoly,#plan.tool-measure,#plan.tool-addwall,#plan.tool-addglass,#plan.tool-adddoor{cursor:crosshair}
.door-item{cursor:pointer}.door-item:hover>rect{stroke:#b5653a;stroke-width:2}
#plan.tool-select .wall{pointer-events:all;cursor:pointer}
#panel .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
#panel .fields label{display:grid;gap:5px}
#panel .fields input,#panel .fields select{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px;background:#fff}
#panel .fields input[type=color]{height:30px;padding:2px}
#plan .wall{pointer-events:none}
#plan.tool-partialdemolish .wall,#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.actions .btn.primary{background:var(--accent);color:#fff}
.actions .btn.primary:hover{background:#9f5530}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:none}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 当前视角效果图 ---------- */
#renderDialog{padding:0;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);
  width:min(1120px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);overflow:auto}
#renderDialog::backdrop{background:rgba(20,22,24,.65)}
.render-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.render-head h2{font-size:16px;margin:0}
.render-close{font-size:24px;line-height:1;width:36px;height:36px;padding:0}
.render-body{display:grid;grid-template-columns:minmax(0,1fr) 250px}
.render-preview{display:flex;align-items:center;justify-content:center;min-width:0;min-height:260px;background:#202326;padding:16px}
.render-preview img{display:block;width:100%;height:auto;max-height:65dvh;object-fit:contain}
.render-settings{padding:16px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.render-field{display:flex;flex-direction:column;gap:6px;font-size:12px}
.render-options{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
.render-options .btn{flex:1;min-width:0}
.render-field select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff}
.render-field input[type=range]{width:100%;accent-color:var(--accent)}
.render-field>span{display:flex;justify-content:space-between;gap:8px}
#renderDimensions{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#renderStatus{min-height:3em;margin:0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
#renderStatus.error{color:#b3372a}
.render-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.render-actions .btn{min-height:38px;border:1px solid var(--line)}
.render-actions [hidden]{display:none}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
#heightDialog{padding:0;width:min(400px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
#heightDialog::backdrop{background:rgba(20,22,24,.45)}
.height-fields{display:grid;gap:16px;padding:16px}
.height-fields input{width:100%;box-sizing:border-box;min-height:40px;padding:8px;font-size:16px;
  border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
#heightError{min-height:2.8em;margin:0;font-size:12px;color:#b3372a;overflow-wrap:anywhere}
.height-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.height-actions .btn{border:1px solid var(--line);min-height:38px}
@media (max-width:640px){
  .render-body{grid-template-columns:minmax(0,1fr)}
  .render-preview{min-height:150px;padding:10px}
  .render-preview img{max-height:40dvh}
  .render-settings{border-left:0;border-top:1px solid var(--line);gap:12px}
  .render-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .render-actions .btn{flex:1;min-width:0;white-space:normal}
}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
</style>
<script type="importmap">
{"imports":{
  "three":"./vendor/three/build/three.module.js",
  "three/addons/":"./vendor/three/examples/jsm/"
}}
</script>

<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library">◧ 家具库</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨">属性 ◨</button>
    </div>
    <div class="brand"><b data-en="3BR 2LR 2BA · Interior Design">三室两厅两卫 · 装修设计</b><span id="subtitle">原始户型 1:60 · 尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg" title="切换 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan">2D 平面</button>
      <button class="btn" data-view="3d" data-en="3D Scene">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)" data-en="Select">选择</button>
      <button class="btn" data-tool="measure" title="测量 (M)" data-en-title="Measure (M)" data-en="Measure">测量</button>
      <button class="btn" data-tool="demolish" title="拆改墙、玻璃和门 (X)" data-en-title="Remodel walls, glass and doors (X)" data-en="Remodel">构件拆改</button>
      <button class="btn" data-tool="partialdemolish" data-en="Remove part">局部拆除</button>
      <button class="btn" data-tool="addwall" data-en="Add wall">新增墙体</button>
      <button class="btn" data-tool="addglass" data-en="Add glass">新增玻璃</button>
      <button class="btn" data-tool="adddoor" data-en="Add door">新增门</button>
      <button class="btn" data-tool="floorrect" data-en="Floor zones">地面分区</button>
    </div>
    <div class="grp only2d">
      <button class="btn" id="zoomOut" title="缩小" data-en-title="Zoom out">−</button>
      <button class="btn" id="zoomIn" title="放大" data-en-title="Zoom in">＋</button>

const DEFAULT_HEIGHTS = {ceiling:2.8, eye:1.6};
function normalizeHeights(h){
  const ceiling = typeof h?.ceiling === 'number' && Number.isFinite(h.ceiling) ? Math.max(2, Math.min(10, h.ceiling)) : DEFAULT_HEIGHTS.ceiling;
  const eye = typeof h?.eye === 'number' && Number.isFinite(h.eye) ? h.eye : DEFAULT_HEIGHTS.eye;
  return {ceiling, eye:Math.max(.5, Math.min(Number((ceiling - .2).toFixed(6)), eye))};
}
function defaultState(){
  const rooms = {}; ROOMS.forEach(r => rooms[r.id] = {name:r.name, mat:r.mat});
  return {furniture:defaultFurniture(), wallDecor:[], rooms, demolished:[], measures:[], architecture:normalizeArchitecture(null), doorEdits:normalizeDoorEdits(null), floorZones:[], floorRepairs:normalizeFloorRepairs(null), cadPlan:null, heights:{...DEFAULT_HEIGHTS}};
}

const STORE = 'cadtour-open-source-v1';
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.furniture)) return fixState(s); } catch(e) {}
  return null;
}
function fixState(s){
  AssetLibrary.installRefs(s.assetReferences);
  const d = defaultState();
  s.rooms = Object.assign(d.rooms, s.rooms || {});
  s.demolished = s.demolished || []; s.measures = s.measures || [];
  s.cadPlan = s.cadPlan || null;
  s.architecture = normalizeArchitecture(s.architecture);
  s.wallDecor = normalizeWallDecor(s.wallDecor);
  s.doorEdits = normalizeDoorEdits(s.doorEdits);
  s.floorZones = normalizeFloorZones(s.floorZones);
  s.floorRepairs = normalizeFloorRepairs(s.floorRepairs);
  for (const room of Object.values(s.rooms)) if (room && !/^#[\da-f]{6}$/i.test(room.color || '')) delete room.color;
  s.heights = normalizeHeights(s.heights);
  for (const f of s.furniture) f.elevation = normalizeFurnitureElevation(f.elevation);
  FurnitureSupport.normalize(s.furniture);
  return s;
}

function validateSel(){ if ((ui.sel?.kind==='floorrepair' && !getFloorRepair(ui.sel.id)) || (ui.sel?.kind==='door' && !getDoor(ui.sel.id)) || (ui.sel?.kind==='floorzone' && !getFloorZone(ui.sel.id)) || (ui.sel?.kind==='furn' && !getF(ui.sel.id)) || (ui.sel?.kind==='arch' && !getArchitecture(ui.sel.id))) ui.sel = null; }
const getF = id => state.furniture.find(f => f.id === id);

/* ======================= 几何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const perim = poly => poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + Math.hypot(q[0]-p[0], q[1]-p[1]); }, 0) / 1000;
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;
function snapRects(){ return architectureEntries().map(e => e.rect); }
function roomState(r){
  if (!state.rooms[r.id]) state.rooms[r.id] = {name:r.name, mat:r.mat || 'tile800'};
  return state.rooms[r.id];
}

/* ======================= 颜色 / 材质图案 ======================= */
function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

  const plank = (id,base,line) => `<pattern id="m-${id}" patternUnits="userSpaceOnUse" width="1800" height="360">
      <rect width="1800" height="360" fill="${base}"/>
      <path d="M0 0H1800M0 180H1800M1200 0V180M600 180V360" stroke="${line}" stroke-width="10"/>
      <path d="M100 70Q500 60 900 85T1700 75M200 260Q700 250 1100 275T1750 262" stroke="${line}" stroke-width="5" fill="none" opacity=".45"/></pattern>`;
  const tile = (id,size,base,line) => `<pattern id="m-${id}" patternUnits="userSpaceOnUse" width="${size}" height="${size}">
      <rect width="${size}" height="${size}" fill="${base}"/><path d="M0 0H${size}M0 0V${size}" stroke="${line}" stroke-width="10"/></pattern>`;
  $('#defs').innerHTML =

    tile('tile800',800,'#ece7de','#d3cabb') + tile('tile600',600,'#e2e6e3','#c4cbc6') + tile('antislip',300,'#d6dbd7','#b3bab4') +
    `<pattern id="m-marble" patternUnits="userSpaceOnUse" width="1200" height="1200">
      <rect width="1200" height="1200" fill="#f3f0ea"/><path d="M0 0H1200M0 0V1200" stroke="#dcd5c8" stroke-width="10"/>
      <path d="M-50 300C250 260 380 520 700 470S1100 640 1260 600M200 1200C300 950 520 980 640 820" stroke="#d6cfc2" stroke-width="12" fill="none"/></pattern>
    <pattern id="m-terrazzo" patternUnits="userSpaceOnUse" width="500" height="500">
      <rect width="500" height="500" fill="#e8e1d5"/>
      <circle cx="60" cy="80" r="22" fill="#b9a58c"/><circle cx="310" cy="140" r="16" fill="#8fa3a0"/><circle cx="190" cy="330" r="26" fill="#c9b7a2"/>
      <circle cx="420" cy="400" r="18" fill="#a88f76"/><circle cx="90" cy="440" r="12" fill="#8fa3a0"/><circle cx="440" cy="40" r="10" fill="#b9a58c"/></pattern>
    <pattern id="m-carpet" patternUnits="userSpaceOnUse" width="120" height="120">

    <pattern id="grid" patternUnits="userSpaceOnUse" width="1000" height="1000">
      <path d="M500 0V1000M0 500H1000" stroke="#e5dfd3" stroke-width="8"/><path d="M0 0V1000M0 0H1000" stroke="#d8d0c1" stroke-width="14"/></pattern>`;
}

/* ======================= 家具图例 ======================= */
const ST = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

function furnSVG(t,w,d,c){
  const x = -w/2, y = -d/2, m = Math.min(w,d);
  switch (t){
    case 'bed': {
      let s = rc(x,y,w,d,'#fbf8f2','rx="30"') + rc(x,y,w,Math.min(90,d*.05),shade(c,.62),'rx="20"');
      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');
      const by = py+ph+110, bh = y+d-15-by;
      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));
      return s;
    }
    case 'sofa': case 'armchair': {
      const b = d*.24, a = Math.min(200,w*.13), n = t==='armchair' ? 1 : (w>2200 ? 3 : 2), cw = (w-2*a)/n, dk = shade(c,.85);
      let s = rc(x,y,w,d,dk,'rx="60"');
      for (let i=0;i<n;i++) s += rc(x+a+i*cw,y+b,cw,d-b-40,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,a,d,dk,'rx="50"') + rc(x+w-a,y,a,d,dk,'rx="50"');
    }
    case 'cornersofa': {
      const k = Math.min(950,d*.56,w*.4), b = 220, dk = shade(c,.85);
      let s = pa(`M${x} ${y}H${x+w}V${y+k}H${x+k}V${y+d}H${x}Z`, dk);
      const cw = (w-b-200)/2;
      s += rc(x+b,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b+cw,y+b,cw,k-b-30,c,'rx="40"') + rc(x+b,y+k,k-b-30,d-k-200,c,'rx="40"');
      return s + rc(x,y,w,b,dk,'rx="50"') + rc(x,y,b,d,dk,'rx="50"') + rc(x+w-200,y,200,k,dk,'rx="50"') + rc(x,y+d-200,k,200,dk,'rx="50"');
    }
    case 'nightstand': return rc(x,y,w,d,c,'rx="30"') + `<circle r="${m*.24}" fill="#fff6dd" ${ST}/>` + `<circle r="${m*.08}" fill="${shade(c,.8)}" ${ST}/>`;
    case 'wardrobe': {
      let s = rc(x,y,w,d,c) + ln(x+50,0,x+w-50,0);
      for (let hx = x+160; hx < x+w-100; hx += 180) s += ln(hx-45,-d*.28,hx+45,d*.28,'opacity=".6"');
      return s;
    }
    case 'cabinet': case 'shoecab': return rc(x,y,w,d,c) + ln(x,y+d,x+w,y);
    case 'dresser': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.2,y,w*.6,55,'#dfe9ee') + ec(0,d/2+180,160,140,shade(c,.9));
    case 'desk': return rc(x,y,w,d,c,'rx="20"') + rc(-w*.18,y+50,w*.36,45,'#555') + rc(-w*.14,y+d*.45,w*.28,d*.28,'#f4f4f4','rx="10"');
    case 'chair': return rc(x+25,y+d*.16,w-50,d*.84-10,c,'rx="60"') + rc(x,y,w,d*.2,shade(c,.78),'rx="40"');
    case 'bookshelf': { let s = rc(x,y,w,d,c); for (let bx = x+400; bx < x+w-50; bx += 400) s += ln(bx,y,bx,y+d); return s; }
    case 'baycushion': return rc(x,y,w,d,c,'rx="60"') + rc(x+60,y+80,w-120,Math.min(300,d*.2),'#fff','rx="60"') + rc(x+60,y+d-80-Math.min(300,d*.2),w-120,Math.min(300,d*.2),'#fff','rx="60"');
    case 'coffeetable': return rc(x,y,w,d,c,'rx="80"') + rc(x+60,y+60,w-120,d-120,shade(c,1.06),'rx="50"');
    case 'tvstand': return rc(x,y,w,d,c) + rc(x+w*.15,y+30,w*.7,55,'#3a3a3a');
    case 'rug': return rc(x,y,w,d,c,'rx="40" fill-opacity=".6"') + rc(x+90,y+90,w-180,d-180,'none','rx="30" stroke-dasharray="3 3" opacity=".6"');
    case 'indoorplant': return furnSVG('plant',w,d,c==='#ffffff'?'#78985b':c);
    case 'hertfordchair': return furnSVG('armchair',w,d,c==='#ffffff'?'#c9bba9':c);
    case 'receptiontable': return rc(x,y,w,d,c==='#ffffff'?'#bda581':c,'rx="30"')+rc(x+w*.08,y+d*.08,w*.84,d*.25,'#d5d3ce','rx="20"')+ln(x+w*.08,y+d*.4,x+w*.92,y+d*.4);
    case 'imaccomputer': return rc(x+w*.05,y+d*.08,w*.9,d*.12,'#535960','rx="15"')+rc(x+w*.37,y+d*.21,w*.26,d*.24,c==='#ffffff'?'#c5c9cc':c,'rx="15"')+rc(x+w*.08,y+d*.58,w*.64,d*.25,'#e0e2e1','rx="15"')+ec(x+w*.84,y+d*.7,w*.08,d*.12,'#e0e2e1');
    case 'testmodel222': return rc(x,y,w,d,c==='#ffffff'?'#d4d0c8':c)+rc(x+w*.33,y+d*.2,w*.6,d*.64,'#f2eee6')+rc(x+w*.4,y+d*.36,w*.2,d*.18,'#98b6b2')+rc(x+w*.7,y+d*.36,w*.2,d*.18,'#b8b8b2')+`<text x="0" y="${d*.4}" text-anchor="middle" font-size="${Math.min(w,d)*.18}" fill="#514b43">222</text>`;
    case 'meetingtableu': {
      const b=Math.min(w*.25,d*.18),colour=c==='#ffffff'?'#ac8c63':c;
      return pa(`M${x} ${y}H${x+w}V${y+d}H${x+w-b}V${y+b}H${x+b}V${y+d}H${x}Z`,colour);
    }
    case 'grandfir': {
      const colour=c==='#ffffff'?'#48704b':c;
      let s=ec(0,0,w/2,d/2,colour);
      for(let k=0;k<12;k++) s+=`<ellipse cx="0" cy="${-d*.25}" rx="${w*.10}" ry="${d*.24}" transform="rotate(${k*30})" fill="${shade(colour,.82)}" ${ST}/>`;
      return s+ec(0,0,w*.055,d*.055,'#80603d');
    }
    case 'plant': {
      let s = `<circle r="${m/2}" fill="${c}" fill-opacity=".85" ${ST}/>`;
      for (let k=0;k<8;k++) s += `<ellipse cx="0" cy="${-m*.27}" rx="${m*.1}" ry="${m*.21}" transform="rotate(${k*45})" fill="${shade(c,.8)}" ${ST}/>`;
      return s + `<circle r="${m*.1}" fill="#8a6a4a" ${ST}/>`;
    }
    case 'table': return rc(x,y,w,d,c,'rx="30"') + rc(x+50,y+50,w-100,d-100,'none','rx="20" opacity=".4"');
    case 'roundtable': return ec(0,0,w/2,d/2,c) + ec(0,0,w/2-50,d/2-50,'none','opacity=".4"');
    case 'counter': return rc(x,y,w,d,c) + ln(x,y+d-40,x+w,y+d-40,DASH);
    case 'stove': {
      let s = rc(x,y,w,d,'#2f2f2f','rx="20"'); const r = m*.26;
      const pts = w/d > 1.4 ? [[-w/4,0],[w/4,0]] : [[-w/4,-d/4],[w/4,-d/4],[-w/4,d/4],[w/4,d/4]];
      pts.forEach(([px,py]) => s += `<circle cx="${px}" cy="${py}" r="${r}" fill="none" stroke="#bbb" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="${px}" cy="${py}" r="${r*.45}" fill="#666"/>`);
      return s;
    }
    case 'ksink': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.06,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + rc(x+w*.52,y+d*.18,w*.42,d*.66,'#fff','rx="50"') + `<circle cx="0" cy="${y+d*.09}" r="22" fill="#999"/>`;
    case 'fridge': return rc(x,y,w,d,c,'rx="30"') + ln(x,y+d*.14,x+w,y+d*.14) + ln(0,y+d*.14,0,y+d) + rc(-70,y+d*.5,40,d*.25,'#aab') + rc(30,y+d*.5,40,d*.25,'#aab');
    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {
      let s = rc(x,y,w,d,c,'rx="20"') + rc(x+45,y+45,w-90,d-90,'#fff','rx="20"');
      for (let sx = x+90; sx < x+w-60; sx += 90) s += ln(sx,y,sx,y+45,'opacity=".5"') + ln(sx,y+d-45,sx,y+d,'opacity=".5"');
      return s;
    }
    case 'beanbag': return ec(0,0,w/2,d/2,c) + ec(-w*.04,-d*.06,w*.3,d*.28,shade(c,1.12),'opacity=".9"');
    case 'sidetable': return ec(0,0,w/2,d/2,c) + ec(0,0,w*.12,d*.12,'none','opacity=".5"');
    case 'floorlamp': return `<circle r="${m*.5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m*.32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m*.07}" fill="${c}" ${ST}/>`;
    case 'island': return rc(x,y,w,d,c) + ln(x,y+d-250,x+w,y+d-250,DASH);
    case 'barstool': return `<circle r="${m/2}" fill="${c}" ${ST}/><circle r="${m*.3}" fill="${shade(c,1.15)}" ${ST}/>`;
    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {
      let s = rc(x,y,w,d,c,`rx="30" ${DASH}`);
      [.25,.5,.75].forEach(k => s += ln(x+w*k,y+d,x+w*k,y+d+200,`${DASH} opacity=".6"`));
      return s;
    }
    case 'dishwasher': return rc(x,y,w,d,c,'rx="15"') + ln(x,y+d-70,x+w,y+d-70) + rc(x+w*.3,y+d-45,w*.4,25,'#888');
    case 'ovencol': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d) + ln(x+w,y,x,y+d);
    case 'purifier': return rc(x,y,w,d,c,'rx="60"') + rc(x+45,y+45,w-90,d-90,'none',`rx="40" ${DASH}`);
    case 'dentalchair': {
      const base = shade(c,.82);
      // Match the imported setup: head at -Z (plan top), feet at +Z.
      return rc(x+w*.4,y+d*.44,w*.22,d*.3,base,'rx="45"')
        + rc(x+w*.35,y+d*.28,w*.36,d*.25,c,'rx="80"')
        + rc(x+w*.4,y+d*.51,w*.28,d*.22,c,'rx="65"')
        + rc(x+w*.42,y+d*.71,w*.24,d*.26,shade(c,.92),'rx="55"')
        + rc(x+w*.45,y+d*.16,w*.17,d*.13,shade(c,1.15),'rx="50"')
        + `<circle cx="${x+w*.15}" cy="${y+d*.13}" r="${m*.12}" fill="${c}" ${ST}/>`
        + rc(x+w*.77,y+d*.47,w*.2,d*.18,'#e5dfd3','rx="20"')
        + `<path d="M${x+w*.77} ${y+d*.6}L${x+w*.77} ${y+d*.18}L${x+w*.61} ${y+d*.1}" fill="none" ${ST}/>`
        + rc(x+w*.55,y+d*.07,w*.15,d*.06,'#fff6dd','rx="20"');
    }
    case 'doctorstool': return `<circle r="${m*.43}" fill="${c}" ${ST}/><circle r="${m*.24}" fill="${shade(c,1.15)}" ${ST}/>`
      + [0,72,144,216,288].map(a => `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${a})" ${ST}/><circle cx="0" cy="${m*.5}" r="${m*.045}" transform="rotate(${a})" fill="#555" ${ST}/>`).join('');
    case 'dentalcart': return rc(x,y,w,d,c,'rx="25"') + rc(x+60,y+70,w-120,d*.25,'#fff','rx="12"')
      + ln(x+80,y+d*.5,x+w-80,y+d*.5) + ln(x+80,y+d*.72,x+w-80,y+d*.72)
      + `<circle cx="${x+w*.18}" cy="${y+d+55}" r="45" fill="#555" ${ST}/><circle cx="${x+w*.82}" cy="${y+d+55}" r="45" fill="#555" ${ST}/>`;
    case 'instrumentcab': case 'storagecab': case 'displaycab': return rc(x,y,w,d,c,'rx="12"') + rc(x+55,y+55,w-110,d-110,'rgba(255,255,255,.35)',DASH)
      + ln(0,y+40,0,y+d-40) + ln(x+w*.33,y+80,x+w*.33,y+d-80) + ln(x+w*.66,y+80,x+w*.66,y+d-80);
    case 'sidecab': return rc(x,y,w,d,c,'rx="12"') + ln(x+w*.25,y,x+w*.25,y+d) + ln(x+w*.5,y,x+w*.5,y+d) + ln(x+w*.75,y,x+w*.75,y+d)
      + rc(x+w*.08,y+d*.36,w*.1,d*.28,'#8a8174','rx="8"') + rc(x+w*.58,y+d*.36,w*.1,d*.28,'#8a8174','rx="8"');
    case 'handwash': case 'sinkcab': return rc(x,y,w,d,c,'rx="20"') + ec(x+w*.34,y+d*.5,w*.22,d*.28,'#fff') + ec(x+w*.68,y+d*.5,w*.22,d*.28,'#fff')
      + `<circle cx="${x+w*.5}" cy="${y+d*.16}" r="${m*.055}" fill="#999" ${ST}/>` + ln(x+w*.5,y+d*.16,x+w*.5,y+d*.32);
    case 'cbct': return `<circle r="${m*.42}" fill="${c}" ${ST}/><circle r="${m*.27}" fill="#f7fbfd" ${ST}/><circle r="${m*.12}" fill="${shade(c,.8)}" ${ST}/>`
      + rc(-w*.08,y+d*.1,w*.16,d*.32,'#7a6f8d','rx="30"') + rc(x+w*.62,y+d*.35,w*.18,d*.22,'#eef1f3','rx="20"')
      + `<path d="M${-m*.34} 0A${m*.34} ${m*.34} 0 0 1 ${m*.34} 0" fill="none" stroke="#fff" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
    case 'oralxray': return rc(x,y,w,d,c,'rx="30"') + `<circle cx="${x+w*.2}" cy="${y+d*.5}" r="${m*.18}" fill="#fff" ${ST}/>`
      + ln(x+w*.35,y+d*.5,x+w*.68,y+d*.22) + ln(x+w*.35,y+d*.5,x+w*.68,y+d*.78)
      + rc(x+w*.66,y+d*.14,w*.2,d*.18,'#4d5963','rx="20"') + rc(x+w*.66,y+d*.68,w*.2,d*.18,'#4d5963','rx="20"');
    case 'scanner': return rc(x,y,w,d,c,'rx="25"') + rc(x+w*.12,y+d*.18,w*.76,d*.3,'#fff','rx="18"') + rc(x+w*.22,y+d*.58,w*.56,d*.18,'#51575d','rx="20"')
      + ln(x+w*.32,y+d*.68,x+w*.68,y+d*.68);
    case 'leadscreen': return rc(x,y,w,d,c,'rx="10"') + ln(x+w*.12,y,x+w*.12,y+d) + ln(x+w*.88,y,x+w*.88,y+d);
    case 'xraydesk': case 'consultdesk': return rc(x,y,w,d,c,'rx="18"') + rc(x+w*.08,y+d*.08,w*.84,d*.12,shade(c,.78),'rx="12"')
      + rc(x+w*.12,y+d*.32,w*.28,d*.42,'#eef1f3','rx="10"') + rc(x+w*.54,y+d*.32,w*.34,d*.42,'#2c3740','rx="10"');
    case 'sterilizer': return rc(x,y,w,d,c,'rx="20"') + rc(x+w*.08,y+d*.14,w*.84,d*.42,'#eef3f6','rx="18"')
      + rc(x+w*.12,y+d*.66,w*.18,d*.16,'#7f8a91','rx="8"') + rc(x+w*.36,y+d*.66,w*.18,d*.16,'#7f8a91','rx="8"') + rc(x+w*.68,y+d*.66,w*.18,d*.16,'#b5653a','rx="8"');
    case 'cleanbench': return rc(x,y,w,d,c,'rx="12"') + rc(x+80,y+70,w-160,d*.42,'rgba(210,230,238,.65)','rx="20"') + ln(x+80,y+d*.62,x+w-80,y+d*.62)
      + ln(x+w*.33,y+80,x+w*.33,y+d-80) + ln(x+w*.66,y+80,x+w*.66,y+d-80);
    case 'medwaste': return rc(x,y,w,d,c,'rx="18"') + `<path d="M${x+w*.5} ${y+d*.18}L${x+w*.68} ${y+d*.5}H${x+w*.32}Z" fill="#fff3d6" ${ST}/>`
      + `<text x="${x+w*.5}" y="${y+d*.56}" font-size="${Math.max(90,m*.22)}" text-anchor="middle" fill="#8f3b2e" pointer-events="none">!</text>`;
    case 'compressor': case 'suction': case 'positivepressure': case 'negativepressure': case 'waterpurifier': {
      const label = {compressor:'AIR', suction:'VAC', positivepressure:'P+', negativepressure:'P-', waterpurifier:'H2O'}[t];
      let s = rc(x,y,w,d,c,'rx="28"') + rc(x+w*.08,y+d*.12,w*.84,d*.24,'rgba(255,255,255,.35)','rx="16"');
      s += `<circle cx="${x+w*.25}" cy="${y+d*.62}" r="${m*.12}" fill="#fff" ${ST}/><circle cx="${x+w*.55}" cy="${y+d*.62}" r="${m*.1}" fill="${shade(c,.75)}" ${ST}/>`;
      s += rc(x+w*.72,y+d*.5,w*.16,d*.26,'#4f5960','rx="10"') + `<text x="${x+w*.5}" y="${y+d*.25}" font-size="${Math.max(90,m*.2)}" text-anchor="middle" fill="#3d3a34" pointer-events="none">${label}</text>`;
      return s;
    }
    case 'frontdesk': return rc(x,y,w,d,c,'rx="24"') + rc(x+80,y+80,w-160,d*.34,shade(c,1.1),'rx="16"')
      + rc(x+w*.08,y+d*.58,w*.22,d*.26,'rgba(255,255,255,.28)','rx="10"') + rc(x+w*.38,y+d*.58,w*.22,d*.26,'rgba(255,255,255,.28)','rx="10"') + rc(x+w*.68,y+d*.58,w*.22,d*.26,'rgba(255,255,255,.28)','rx="10"');
    case 'waitingbench': return rc(x,y+d*.24,w,d*.58,c,'rx="70"') + rc(x,y,w,d*.26,shade(c,.82),'rx="50"')
      + ln(x+w*.33,y+d*.24,x+w*.33,y+d*.82) + ln(x+w*.66,y+d*.24,x+w*.66,y+d*.82);
    case 'officechair': {
      let s = '';
      for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${k*72+36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"')
        + rc(x+w*.02,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"') + rc(x+w*.88,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"');
    }
    case 'piano': {
      let s = rc(x,y,w,d*.55,c,'rx="10"') + rc(x+40,y+d*.55,w-80,d*.4,shade(c,1.4),'rx="10"');
      const kx = x+90, kw = w-180, kd = d*.2;
      s += rc(kx,y+d*.55,kw,kd,'#faf8f3');
      for (let i = 1; i < 26; i++) s += ln(kx+kw*i/26,y+d*.55,kx+kw*i/26,y+d*.55+kd,'opacity=".5"');
      return s;
    }
    case 'treadmill': return rc(x,y,w,d,c,'rx="50"') + rc(x+90,y+320,w-180,d-400,'#1c1c1e','rx="25"') + rc(x,y,w,230,shade(c,1.4),'rx="40"');
    default: return rc(x,y,w,d,c);
  }
}

const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  floorDisplayRegions().forEach(r => s += `<path class="${r.kind === 'zone' ? 'floor-zone' : 'room'}" ${r.kind === 'zone' ? `data-floor-zone="${r.id}"` : `data-room="${r.id}"`} d="${floorSvgPath(r.poly)}" fill="${floorSvgFill(r.mat,r.color)}" fill-rule="evenodd"/>`);
  ROOMS.filter(r => r.counted === false).forEach(r => s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="${floorSvgFill(roomState(r).mat,roomState(r).color)}"/>`);
  const sill = ([a,b,c,d]) => `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  doorOpenings().filter(d=>!d.hidden).forEach(d => s += sill(d.rect));
  $('#gRooms').innerHTML = s;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('');
}

function renderWalls(){
  $('#gWalls').innerHTML = architectureEntries().map(e => {
    const [x0,y0,x1,y1] = e.rect, k = e.structural;
    const glassWithWalls = e.type === 'glass' && (e.baseHeight > 0 || e.topWallHeight > 0);
    let fill = e.type !== 'wall' ? e.color : k==='b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : e.color !== '#f4f1eb' ? e.color : k==='e' ? '#8f897d' : '#a7a195';
    if (glassWithWalls) fill = e.wallColor;
    let ex = e.type !== 'wall' ? 'stroke="#4f7394" stroke-width="1.5" vector-effect="non-scaling-stroke"' : '';
    const attr = e.id.startsWith('w') ? `data-wall="${e.id}"` : '';
    if(e.oriented)return `<polygon class="wall" data-arch="${e.id}" ${attr} points="${e.oriented.poly.map(p=>p.join(',')).join(' ')}" fill="${fill}" ${ex}><title>${architectureLabel(e.type)}</title></polygon>`;
    const centre = !e.hidden && glassWithWalls ? `<line x1="${e.horizontal ? x0 : (x0+x1)/2}" y1="${e.horizontal ? (y0+y1)/2 : y0}" x2="${e.horizontal ? x1 : (x0+x1)/2}" y2="${e.horizontal ? (y0+y1)/2 : y1}" stroke="#4f7394" stroke-width="1.5" vector-effect="non-scaling-stroke" pointer-events="none"/>` : '';
    const pieces=doorSegments(e.rect,0,e.height,e.horizontal,e.id).filter(p=>p.bottom===0);
    return pieces.map(({rect:[a,b,c,d]})=>`<rect class="wall" data-arch="${e.id}" ${attr} x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="${fill}" ${ex}><title>${architectureLabel(e.type)}</title></rect>`).join('')+(pieces.length===1?centre:'');
  }).join('');
}

function cadDisplayLabels(){
  if (!PLAN_META.imported || !state.cadPlan?.labels?.length) return [];
  const seen = new Set();
  return state.cadPlan.labels.filter(t => {
    if (!textLooksLikeRoomName(t.text)) return false;
    const key = `${t.text}|${Math.round(t.x/220)}|${Math.round(t.y/220)}`;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).slice(0, 90);
}

    $('#gDims').innerHTML = `<line x1="${x0}" y1="${y0-420}" x2="${x1}" y2="${y0-420}" ${LS}/>
      <line x1="${x0}" y1="${y0-570}" x2="${x0}" y2="${y0-270}" ${LS}/><line x1="${x1}" y1="${y0-570}" x2="${x1}" y2="${y0-270}" ${LS}/>
      <line x1="${x0-90}" y1="${y0-330}" x2="${x0+90}" y2="${y0-510}" ${TK}/><line x1="${x1-90}" y1="${y0-330}" x2="${x1+90}" y2="${y0-510}" ${TK}/>

      <line x1="${x0-510}" y1="${y0-90}" x2="${x0-330}" y2="${y0+90}" ${TK}/><line x1="${x0-510}" y1="${y1-90}" x2="${x0-330}" y2="${y1+90}" ${TK}/>

  const chain = (horiz, at, start, segs) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
    pts.forEach(p => s += horiz
      ? `<line x1="${p}" y1="${at-170}" x2="${p}" y2="${at+170}" ${LS}/><line x1="${p-80}" y1="${at+80}" x2="${p+80}" y2="${at-80}" ${TK}/>`
      : `<line x1="${at-170}" y1="${p}" x2="${at+170}" y2="${p}" ${LS}/><line x1="${at-80}" y1="${p+80}" x2="${at+80}" y2="${p-80}" ${TK}/>`);
    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v) : txt(at-70, mid, v, true); });

function renderGrid(){

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${Math.round(L)} mm</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;
  $('#gMeasure').innerHTML = s + constructionPreview() + floorPreview() + partialDemolitionPreview();
}

function renderSel(){

    if (f){
      // 触屏上手柄更大、离家具更远，并各带一圈透明的大热区
      const p = 5*k, A = 'stroke="#b5653a" vector-effect="non-scaling-stroke"', hs = COARSE ? 1.7 : 1, ro = (COARSE ? 40 : 26)*k, hit = (COARSE ? 24 : 11)*k;
      const sx = f.w/2+p, sy = f.d/2+p;
      s += `<g transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">
        <rect x="${-f.w/2-p}" y="${-f.d/2-p}" width="${f.w+2*p}" height="${f.d+2*p}" fill="none" ${A} stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none"/>
        <line x1="0" y1="${-f.d/2-p}" x2="0" y2="${-f.d/2-ro}" ${A} stroke-width="1" pointer-events="none"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${hit}" fill="transparent"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${6*hs*k}" fill="#fff" ${A} stroke-width="1.5"><title>${tr('拖动旋转（Shift 自由角度）','Drag to rotate (Shift for free angle)')}</title></circle>
        <circle data-handle="size" cx="${sx}" cy="${sy}" r="${hit}" fill="transparent"/>
        <rect data-handle="size" x="${sx-5*hs*k}" y="${sy-5*hs*k}" width="${10*hs*k}" height="${10*hs*k}" fill="#b5653a"><title>${tr('拖动调整尺寸','Drag to resize')}</title></rect></g>`;
      const {hh} = aabb(f);

    }

  } else if (ui.sel?.kind === 'floorzone'){

    if (regions.length) s += `<path d="${floorSvgPath(polygonClipping.union(...regions.map(r=>r.poly)))}" fill="none" stroke="#b5653a" stroke-width="2" stroke-dasharray="5 3" fill-rule="evenodd" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  } else if (ui.sel?.kind === 'arch' || ui.sel?.kind === 'door'){
    const e = ui.sel.kind==='door'?getDoor(ui.sel.id):getArchitecture(ui.sel.id);
    if (e){ const [x0,y0,x1,y1] = e.rect, p = 4*k; s += `<rect x="${x0-p}" y="${y0-p}" width="${x1-x0+2*p}" height="${y1-y0+2*p}" fill="none" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`; }
  } else if (ui.sel?.kind === 'room'){

    const regions=floorDisplayRegions().filter(p=>p.kind==='room'&&p.id===r.id),poly=regions.length?polygonClipping.union(...regions.map(p=>p.poly)):[roomFloorPolygon(r)];
    s += `<path d="${floorSvgPath(poly)}" fill="rgba(181,101,58,.08)" fill-rule="evenodd" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`;

  $('#gSel').innerHTML = s;

function renderAll(){
  invalidateDoorGeometry();
  if(ui.sel?.kind==='walldecor'&&!getWallDecor(ui.sel.id))ui.sel=null;
  if(ui.sel?.kind==='floorrepair'&&!getFloorRepair(ui.sel.id))ui.sel=null;

  if(ui.sel?.kind==='arch'&&getArchitecture(ui.sel.id)?.hidden)ui.sel=null;
  if(ui.sel?.kind==='door'){const e=getDoor(ui.sel.id);if(e&&((e.hidden&&!e.closed)||e.inactive))ui.sel=null;}

  window.View3D?.sync();
}

/* 侧栏开合：which = 'lib' | 'panel' | null，open 不传则切换。
 * 宽屏：侧栏在布局中收起 / 展开（记住选择）；窄屏：侧栏是浮层抽屉，一次只开一个，which = null 表示全部关闭 */
const PANES = 'huxing-panes';
const panes = (() => { try { return JSON.parse(localStorage.getItem(PANES)) || {}; } catch(e) { return {}; } })();
function drawer(which, open){
  const app = $('.app'), els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  if (n){
    Object.entries(els).forEach(([k, el]) => el.classList.toggle('open', k === which && (open ?? !el.classList.contains('open'))));
  } else {
    Object.values(els).forEach(el => el.classList.remove('open'));
    if (which){
      const k = which === 'lib' ? 'hideLib' : 'hidePanel';
      panes[k] = open === undefined ? !panes[k] : !open;
      try { localStorage.setItem(PANES, JSON.stringify(panes)); } catch(e) {}
    }
  }
  app.classList.toggle('hide-lib', !!panes.hideLib); app.classList.toggle('hide-panel', !!panes.hidePanel);
  syncPaneBtns();
}
function syncPaneBtns(){
  const els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  const vis = k => n ? els[k].classList.contains('open') : !panes[k === 'lib' ? 'hideLib' : 'hidePanel'];
  $('#tgLib').classList.toggle('on', vis('lib')); $('#tgPanel').classList.toggle('on', vis('panel'));
  $('#tgLib').title = vis('lib') ? tr('收起家具库 ( [ )', 'Hide library ( [ )') : tr('展开家具库 ( [ )', 'Show library ( [ )');
  $('#tgPanel').title = vis('panel') ? tr('收起属性面板 ( ] )', 'Hide properties ( ] )') : tr('展开属性面板 ( ] )', 'Show properties ( ] )');
  $('#stage').classList.toggle('drawer-panel', n && vis('panel'));   // 属性抽屉盖住画面时让出底部工具条
}
function closeDrawers(){ if (narrow()) drawer(null); }

/* ======================= 操作 ======================= */
function select(sel){ ui.sel = sel?.kind==='floorrepair'?floorRepairSelection(getFloorRepair(sel.id)):sel; renderWallDecorPlan(); renderSel(); renderPanel(); }
function rotateSel(d){ if (ui.sel?.kind==='furn') mutate(() => { const f = getF(ui.sel.id); f.rot = norm(f.rot + d); }); }
function deleteSel(){ if(ui.sel?.kind==='walldecor')return deleteWallDecor(ui.sel.id); if(ui.sel?.kind==='door') return toggleDoorRemoval(ui.sel.id); if(ui.sel?.kind==='floorzone') return deleteFloorZone(ui.sel.id); if (ui.sel?.kind==='arch') return removeArchitecture(ui.sel.id); if (ui.sel?.kind==='furn'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.furniture = state.furniture.filter(f => f.id !== id)); } }
function duplicateSel(){
  if (ui.sel?.kind !== 'furn') return;
  const f = getF(ui.sel.id), n = {...f, id:uid(), cx:f.cx+200, cy:f.cy+200};
  ui.sel = {kind:'furn', id:n.id}; mutate(() => {
    state.furniture.push(n);
    if(FurnitureSupport.host(f))for(const child of state.furniture.slice()){
      if(child.support?.id!==f.id)continue;
      state.furniture.push({...child,id:uid(),cx:child.cx+200,cy:child.cy+200,support:{...child.support,id:n.id}});
    }
  });
}
// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 4; n++){
    let moved = false;
    for (const r of snapRects()){
      const {hw, hh} = aabb(f), ox = Math.min(f.cx+hw, r[2]) - Math.max(f.cx-hw, r[0]), oy = Math.min(f.cy+hh, r[3]) - Math.max(f.cy-hh, r[1]);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) f.cx = f.cx < (r[0]+r[2])/2 ? r[0]-hw : r[2]+hw;
      else f.cy = f.cy < (r[1]+r[3])/2 ? r[1]-hh : r[3]+hh;
      moved = true;
    }
    if (!moved) return;
  }
}
function addItem(it, x, y){

  pushOut(f);
  ui.sel = {kind:'furn', id:f.id};
  mutate(() => type==='rug' ? state.furniture.unshift(f) : state.furniture.push(f));
  toast(tr(`已添加「${name}」${w}×${d}`, `Added "${nm(name)}" ${w}×${d}`));
}
function toggleWall(id){

/* ======================= 视图 ======================= */
function applyView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `${view.x0} ${view.y0} ${W/view.s} ${H/view.s}`);
  const ratio = 1/(view.s*PX_MM);
  $('#ratio').textContent = '1:' + Math.round(ratio);
  const nice = [100,200,500,1000,2000,5000].find(v => v*view.s >= 60) || 5000;
  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;
  renderSel(); renderMeasure();
}
function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  const rects = [...(state.architecture?.added || []).map(e => e.rect),...doorEntries().map(e=>e.rect),...(state.floorZones||[]).filter(z=>z.scope==='drawn').map(z=>bbox(z.poly))];
  const x0 = Math.min(BOUNDS.x,...rects.map(r => r[0]-500)), y0 = Math.min(BOUNDS.y,...rects.map(r => r[1]-500));
  const x1 = Math.max(BOUNDS.x+BOUNDS.w,...rects.map(r => r[2]+500)), y1 = Math.max(BOUNDS.y+BOUNDS.h,...rects.map(r => r[3]+500));
  view.s = Math.min(W/(x1-x0), H/(y1-y0));
  view.x0 = x0 - (W/view.s - (x1-x0))/2; view.y0 = y0 - (H/view.s - (y1-y0))/2;
  applyView();
}
function zoomAt(ns, mx, my){
  ns = Math.max(.012, Math.min(2, ns));
  const px = view.x0 + mx/view.s, py = view.y0 + my/view.s;
  view.s = ns; view.x0 = px - mx/ns; view.y0 = py - my/ns; applyView();
}
const zoomCenter = k => zoomAt(view.s*k, svg.clientWidth/2, svg.clientHeight/2);
const setRatio = r => zoomAt(1/(r*PX_MM), svg.clientWidth/2, svg.clientHeight/2);

function toMM(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ======================= 吸附 ======================= */
const grid = () => 10;
function snapMove(f, cx, cy){
  let nx = Math.round(cx/grid())*grid(), ny = Math.round(cy/grid())*grid();
  if (!ui.layers.wallSnap) return [nx, ny];
  const {hw, hh} = aabb(f), tol = 10/view.s;
  let bx = tol, by = tol;
  for (const r of snapRects()){
    if (!(r[3] < cy-hh-tol || r[1] > cy+hh+tol)) for (const ex of [r[0], r[2]]) for (const c of [ex+hw, ex-hw]) if (Math.abs(c-cx) < bx){ bx = Math.abs(c-cx); nx = c; }
    if (!(r[2] < cx-hw-tol || r[0] > cx+hw+tol)) for (const ey of [r[1], r[3]]) for (const c of [ey+hh, ey-hh]) if (Math.abs(c-cy) < by){ by = Math.abs(c-cy); ny = c; }
  }
  return [nx, ny];
}
function snapPoint(p, shift){
  let x = Math.round(p.x/10)*10, y = Math.round(p.y/10)*10;
  const tol = 8/view.s; let bx = tol, by = tol;
  for (const r of snapRects()){
    for (const ex of [r[0], r[2]]) if (Math.abs(ex-p.x) < bx){ bx = Math.abs(ex-p.x); x = ex; }
    for (const ey of [r[1], r[3]]) if (Math.abs(ey-p.y) < by){ by = Math.abs(ey-p.y); y = ey; }
  }
  if (shift && ui.mA){ if (Math.abs(x-ui.mA.x) > Math.abs(y-ui.mA.y)) y = ui.mA.y; else x = ui.mA.x; }
  return {x, y};
}

/* ======================= 指针交互 ======================= */
let drag = null, pinch = null;
const touches = new Map();                     // 当前按在平面图上的手指
const svgXY = (x, y) => { const r = svg.getBoundingClientRect(); return [x - r.left, y - r.top]; };
function pinchInfo(){
  const [a, b] = [...touches.values()];
  return {d:Math.max(1, Math.hypot(b.x-a.x, b.y-a.y)), c:svgXY((a.x+b.x)/2, (a.y+b.y)/2)};
}
// 结束当前拖动：移动过的家具记入撤销栈
function endDrag(cancel){
  const d = drag; drag = null; svg.classList.remove('panning');
  if (!d) return;
  if(d.kind==='partialdemolish'){
    if(cancel){ui.partialA=ui.partialB=ui.partialCur=null;}
    else if(d.moved&&ui.partialA&&ui.partialCur){ui.partialB=ui.partialCur;ui.partialCur=null;drawer('panel',true);}
    renderMeasure();renderPanel();return;
  }
  if (d.kind === 'floorrect'){
    if(cancel){ui.floorPoints=[];ui.floorCur=null;} else if(d.moved) finishFloorZone();
    renderMeasure(); return;
  }
  if (d.kind === 'construction'){
    if (cancel){ ui.dA = ui.dCur = null; renderMeasure(); return; }
    if (d.moved && ui.dA && ui.dCur){ const a = ui.dA, b = ui.dCur; ui.dA = ui.dCur = null; addConstructionSegment(a,b); }
    renderMeasure(); return;
  }
  if (d.kind === 'measure'){
    if (cancel){ ui.mA = ui.mCur = null; renderMeasure(); return; }
    if (d.moved && ui.mA && ui.mCur && Math.hypot(ui.mCur.x-ui.mA.x, ui.mCur.y-ui.mA.y) > 20){
      const a = ui.mA, b = ui.mCur; ui.mA = ui.mCur = null; mutate(() => state.measures.push({a, b}));
    }
    renderMeasure(); return;                   // 没拖动：保留起点，等第二次点击
  }
  if (d.kind === 'pan'){
    if (!cancel && !d.moved && ui.tool === 'select') select(d.floorRepair?{kind:'floorrepair',id:d.floorRepair}:d.floorZone ? {kind:'floorzone',id:d.floorZone} : d.room ? {kind:'room', id:d.room} : null);
    return;
  }
  if (d.moved){ commit(d.before); renderAll(); }
}

svg.addEventListener('pointerdown', e => {
  if (e.button === 1 || e.button === 2) return;
  closeDrawers(); $('details.menu').open = false;
  if (e.pointerType !== 'mouse'){
    touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
    svg.setPointerCapture(e.pointerId);
    if (touches.size >= 2){                    // 第二根手指落下：取消单指操作，进入双指缩放 / 平移
      endDrag(['measure','construction','floorrect','partialdemolish','pan'].includes(drag?.kind));
      ui.floorPoints=[];ui.floorCur=null;
      ui.dA = ui.dCur = null; renderMeasure();
      const {d, c} = pinchInfo();
      pinch = {d, c, s:view.s, px:view.x0 + c[0]/view.s, py:view.y0 + c[1]/view.s};
      return;
    }
  }
  if (pinch) return;
  const p = toMM(e), t = e.target;
  if(ui.tool==='partialdemolish'){partialDemolitionDown(p,e);return;}
  if(isFloorTool()){floorPointerDown(p,e);return;}
  if (isConstructionTool()){
    const q = constructionPoint(p);
    if (!ui.dA){ ui.dA = q; ui.dCur = q; drag = {kind:'construction',sx:e.clientX,sy:e.clientY,moved:false}; svg.setPointerCapture(e.pointerId); }
    else { const a = ui.dA; ui.dA = ui.dCur = null; addConstructionSegment(a,q); }
    renderMeasure(); return;
  }
  if (ui.tool === 'measure'){
    const q = snapPoint(p, e.shiftKey);
    if (!ui.mA){ ui.mA = q; ui.mCur = q; drag = {kind:'measure', sx:e.clientX, sy:e.clientY, moved:false}; svg.setPointerCapture(e.pointerId); }
    else { const a = ui.mA; ui.mA = null; ui.mCur = null; if (Math.hypot(q.x-a.x, q.y-a.y) > 20) mutate(() => state.measures.push({a, b:q})); }
    renderMeasure(); return;
  }
  if(ui.tool==='select'&&t.closest('[data-wall-decor]')){select({kind:'walldecor',id:t.closest('[data-wall-decor]').dataset.wallDecor});drawer('panel',true);return;}
  const h = t.closest('[data-handle]');
  if (h && ui.sel?.kind === 'furn'){
    drag = {kind:h.dataset.handle, id:ui.sel.id, sx:e.clientX, sy:e.clientY, before:snap(), moved:false};
  } else if (ui.tool === 'demolish' && t.closest('[data-door]')){

  } else if (ui.tool === 'select' && t.closest('[data-door]')){
    select({kind:'door',id:t.closest('[data-door]').dataset.door});drawer('panel',true);return;
  } else if (ui.tool === 'demolish' && t.closest('[data-wall]')){
    toggleWall(t.closest('[data-wall]').dataset.wall); return;
  } else if (ui.tool === 'demolish' && t.closest('[data-arch]')){
    removeArchitecture(t.closest('[data-arch]').dataset.arch); return;
  } else if (ui.tool === 'select' && t.closest('[data-arch]')){
    select({kind:'arch',id:t.closest('[data-arch]').dataset.arch}); drawer('panel',true); return;
  } else if (ui.tool === 'select' && t.closest('[data-fid]')){
    const f = getF(t.closest('[data-fid]').dataset.fid);
    if (ui.sel?.id !== f.id) select({kind:'furn', id:f.id});
    drag = {kind:'move', id:f.id, sx:e.clientX, sy:e.clientY, ox:p.x-f.cx, oy:p.y-f.cy, before:snap(), moved:false};
  } else {
    const room = t.closest('[data-room]');
    drag = {kind:'pan', sx:e.clientX, sy:e.clientY, x0:view.x0, y0:view.y0, room:room && room.dataset.room, floorZone:t.closest('[data-floor-zone]')?.dataset.floorZone,floorRepair:t.closest('[data-floor-repair]')?.dataset.floorRepair, moved:false};
  }
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch){
    if (touches.size < 2) return;
    const {d, c} = pinchInfo(), ns = Math.max(.012, Math.min(2, pinch.s * d / pinch.d));
    view.s = ns; view.x0 = pinch.px - c[0]/ns; view.y0 = pinch.py - c[1]/ns; applyView();
    return;
  }
  const p = toMM(e);
  $('#cx').textContent = Math.round(p.x) + ' mm'; $('#cy').textContent = Math.round(p.y) + ' mm';
  if (!drag){
    const room = e.target.closest && e.target.closest('[data-room]');
    $('#hover').innerHTML = room ? `<b>${esc(roomState(ROOMS.find(r=>r.id===room.dataset.room)).name)}</b> ${fmt(area(ROOMS.find(r=>r.id===room.dataset.room).poly))} m²` : '';
    if(ui.tool==='partialdemolish'&&ui.partialA&&!ui.partialB){const target=getArchitecture(ui.partialTarget);if(target){ui.partialCur=projectArchitecturePoint(target,p);renderMeasure();}}
    if(isFloorTool() && ui.floorPoints.length){ui.floorCur=floorPoint(p,e.shiftKey);renderMeasure();}
    if (isConstructionTool() && ui.dA){ ui.dCur = constructionPoint(p); renderMeasure(); }
    if (ui.tool === 'measure' && ui.mA){ ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); }
    return;
  }
  const far = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) >= TAP;
  if(drag.kind==='partialdemolish'){if(far)drag.moved=true;const target=getArchitecture(ui.partialTarget);if(target)ui.partialCur=projectArchitecturePoint(target,p);renderMeasure();return;}
  if(drag.kind === 'floorrect'){if(far) drag.moved=true;ui.floorCur=floorPoint(p,e.shiftKey);renderMeasure();return;}
  if (drag.kind === 'construction'){
    if (far) drag.moved = true;
    ui.dCur = constructionPoint(p); renderMeasure(); return;
  }
  if (drag.kind === 'measure'){
    if (far) drag.moved = true;
    ui.mCur = snapPoint(p, e.shiftKey); renderMeasure(); return;
  }
  if (drag.kind === 'pan'){
    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }

  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;

function box(w, h, d, m, x = 0, y = 0, z = 0){

}
function rbox(w, h, d, m, x = 0, y = 0, z = 0, r = .04){

function lathe(pts, m, x = 0, y = 0, z = 0, seg = 40){

function fronts(g, x0, y0, w, h, z, nx, ny, m, hd = 'bar', hy = null){

function clearGroup(g){
  const dispose = (o, shared = false) => {
    shared ||= !!o.userData.sharedAsset;
    if (o.geometry && !shared) o.geometry.dispose();
    if (o.material){
      for (const m of Array.isArray(o.material) ? o.material : [o.material])
        if (m.userData.instanceMaterial){ if(m.userData.instanceTexture) m.map?.dispose(); m.dispose(); }
    }
    o.children.forEach(child => dispose(child, shared));
  };
  dispose(g); g.clear();
}

/* ======================= 进入 / 退出 3D ======================= */
async function enter(){
  init(); active = true;
  renderer.setSize(SW(), SH()); labelRenderer.setSize(SW(), SH()); camera.aspect = SW()/SH(); camera.updateProjectionMatrix();
  sync(true);
  opt.mode = 'orbit'; orbit.enabled = false; showLabels(false);
  const A = planPose(), B = isoFrom(A);
  grow = 0; furnGrow = 0; applyGrow(); setPose(A);
  stage.classList.add('animating');
  startLoop(); renderer.render(scene, camera);
  stage.classList.add('is3d');                       // 交叉淡入：此刻 3D 画面与 2D 平面完全重合
  await wait(420);
  await animate(1700, t => {
    camTween(A, B, ease(clamp01(t/.85)));
    grow = ease(clamp01((t - .1)/.55));
    furnGrow = ease(clamp01((t - .45)/.5));
    applyGrow();
  });
  orbit.enabled = true; showLabels(opt.labels);
  stage.classList.remove('animating');
}
async function exit(){
  wheelZoom?.reset();
  if (opt.mode === 'walk'){ walkCtl.unlock(); stopTouchWalk(); $('#hint3d').textContent = HINT_ORBIT; $('#walkOverlay').style.display = 'none'; $('#cross').style.display = 'none';
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir); orbit.target.copy(camera.position).addScaledVector(dir, 3).setY(0); opt.mode = 'orbit'; syncModeBtns(); }
  fly = null; orbit.enabled = false; showLabels(false); stage.classList.add('animating');
  const A = curPose(), B = planPose();
  await animate(1300, t => {
    camTween(A, B, ease(clamp01((t - .1)/.9)));
    furnGrow = 1 - ease(clamp01(t/.45));
    grow = 1 - ease(clamp01((t - .2)/.6));
    applyGrow();
  });
  stage.classList.remove('is3d');                    // 此刻 3D 已压平为正俯视，与 2D 重合后淡出
  await wait(450);
  active = false; cancelAnimationFrame(raf); raf = 0;
  stage.classList.remove('animating');
  grow = furnGrow = 1; applyGrow();
}

      ao.kernelRadius = .25; ao.minDistance = .001; ao.maxDistance = .12;
      composer.addPass(ao);
      // 接触阴影单独使用较小缓冲，4K 出图时控制显存占用。
      const scale = Math.min(1, 1280 / Math.max(w, h));
      ao.setSize(Math.round(w * scale), Math.round(h * scale));
    }
    composer.addPass(new OutputPass());
    composer.render(0);
    // 色调映射后再抗锯齿，写入 8-bit 缓冲以生成标准 PNG。
    output = new THREE.WebGLRenderTarget(w, h, {depthBuffer:false});
    fxaa = new ShaderPass(FXAAShader); fxaa.renderToScreen = false;
    fxaa.uniforms.resolution.value.set(1 / w, 1 / h);
    fxaa.render(renderer, output, composer.readBuffer, 0);
    const pixels = new Uint8Array(w * h * 4);
    renderer.readRenderTargetPixels(output, 0, 0, w, h, pixels);
    if (renderer.getContext().isContextLost()) throw new Error('WebGL context lost');
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d'), image = ctx.createImageData(w, h), stride = w * 4;
    // WebGL 像素原点在左下，PNG 原点在左上。
    for (let y = 0; y < h; y++) image.data.set(pixels.subarray((h - y - 1) * stride, (h - y) * stride), y * stride);
    ctx.putImageData(image, 0, 0);
    renderStatus(tr('正在生成图片…', 'Encoding image…'));
    const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('PNG encoding failed')), 'image/png'));
    if (session !== renderSession) return;
    if (session.url) URL.revokeObjectURL(session.url);
    session.blob = blob; session.url = URL.createObjectURL(blob); $('#renderImage').src = session.url;
    renderStatus(tr(`已生成 · ${w} × ${h} · ${(blob.size / 1024 / 1024).toFixed(1)} MB`, `Ready · ${w} × ${h} · ${(blob.size / 1024 / 1024).toFixed(1)} MB`));
  } catch(err){
    console.error('Render image failed:', err);
    if (session === renderSession) renderStatus(tr('渲染失败，请检查网络或改用 2K / 标准画质后重试', 'Render failed. Check the connection or retry at 2K / Standard quality.'), true);
  } finally {
    restoreView?.();
    if (previous){
      scene.overrideMaterial = previous.override;
      renderer.toneMappingExposure = previous.exposure; renderer.autoClear = previous.autoClear;
      renderer.setClearColor(previous.clear, previous.alpha); renderer.setRenderTarget(previous.target);
    }
    composer?.passes.forEach(p => {
      p.dispose?.();
      // Three.js r160 的 SSAOPass.dispose 不释放这两个资源。
      p.ssaoMaterial?.dispose(); p.noiseTexture?.dispose();
    });
    composer?.dispose(); fxaa?.dispose(); output?.dispose();
    renderBusy = false;
    if (session === renderSession) syncRenderControls();
  }
}
function cancelCycles(){
  const s = renderSession;
  if (!s?.cycles) return;
  s.cycles.cancelled = true; s.cycles.controller.abort();
  if (s.cycles.job) fetch(`/api/cycles/jobs/${s.cycles.job}`, {method:'DELETE', headers:{'X-CADtour':'1'}}).catch(console.error);
}
async function cyclesJSON(url, options = {}){
  const response = await fetch(url, {headers:{'Content-Type':'application/json','X-CADtour':'1'}, ...options});
  if (!response.ok){
    const error = await response.json().catch(() => ({}));
    throw new Error(error.error || tr('本地 Cycles 服务未启动，请用 render_server.py 启动项目', 'Start the project with render_server.py to use local Cycles.'));
  }
  return response.json();
}
async function exportCyclesScene(session){
  await readyFurnitureAssets();
  await readyWallFinishes(archUp);
  await readyWallDecor(decorG);
  const {GLTFExporter} = await import('three/addons/exporters/GLTFExporter.js');
  const model = new THREE.Scene(), materials = new Map();
  const copyMaterial = (source, role) => {
    const key = source.uuid + role;
    if (!materials.has(key)){
      const m = source.clone(); m.name = role + '_' + source.uuid;
      m.userData = {renderRole:role};
      for(const field of ['wallFinish','wallTextureSize','wallNormalStrength','wallTint'])if(source.userData[field]!==undefined)m.userData[field]=source.userData[field];
      materials.set(key, m);
    }
    return materials.get(key);
  };
  scene.updateMatrixWorld(true);
  const nativeGroups=[];
  for(const root of [furnG,decorG])root.traverse(g=>{if(!g.userData.assetLoaded)return;for(let p=g;p;p=p.parent)if(!p.visible)return;nativeGroups.push(g);});
  const nativeFurniture = nativeGroups.map(g=>({
    id:g.userData.fid, type:g.userData.assetType, matrix:g.matrixWorld.toArray(),
    size:g.userData.nativeSize.slice(), colour:g.userData.nativeColour,
    ...(g.userData.preserveMaterials?{preserveMaterials:true}:{})
  }));
  let count = 0;
  for (const [root, category] of [[ground,'ground'],[archFloor,'floor'],[archUp,'wall'],[decorG,'wall-decoration'],[furnG,'furniture'],[lampG,'fixture']]){
    root.traverse(o => {
      if (!o.isMesh) return;
      const role = o.userData.renderRole || (o.userData.room ? 'floor' : category);
      const overhead=role==='ceiling'||role==='ceiling-light';
      for (let p = o; p; p = p.parent) if (!p.visible && !(p===o&&overhead)) return;
      if (overhead && (session.camera.position.y>=H || opt.cut<H)) return;
      const material = m => copyMaterial(m, m.userData.renderRole || (m === glassMat ? 'glass' : role));
      const mesh = new THREE.Mesh(o.geometry, Array.isArray(o.material) ? o.material.map(material) : material(o.material));
      let furniture=o;while(furniture && !furniture.userData.fid) furniture=furniture.parent;
      mesh.name = `${role}_${++count}`; mesh.userData = {renderRole:role, ...(o.userData.architectureId ? {architectureId:o.userData.architectureId} : {}), ...(o.userData.floorZoneId ? {floorZoneId:o.userData.floorZoneId} : {}), ...(o.userData.floorRepairId ? {floorRepairId:o.userData.floorRepairId} : {}), ...(furniture?.userData.assetType ? {furnitureId:furniture.userData.fid,furnitureType:furniture.userData.assetType} : {})};
      if(o.userData.architectureDetailId)mesh.userData.architectureDetailId=o.userData.architectureDetailId;
      for(const field of ['wallDecorId','wallDecorKind','wallDecorHostId'])if(o.userData[field])mesh.userData[field]=o.userData[field];
      let door=o;while(door&&!door.userData.doorId)door=door.parent;if(door?.userData.doorId)mesh.userData.doorId=door.userData.doorId;
      // Flatten world transforms without copying circular door references.
      mesh.matrix.copy(o.matrixWorld); mesh.matrixAutoUpdate = false; model.add(mesh);
    });
  }
  if (!count) throw new Error(tr('场景中没有可渲染的模型', 'There is no geometry to render.'));
  const cam = session.camera.clone(); cam.name = 'CADtour_Camera'; cam.userData = {}; model.add(cam);
  try {
    const glb = await new GLTFExporter().parseAsync(model, {binary:true, onlyVisible:true, maxTextureSize:2048});
    if (glb.byteLength > 128 * 1024 * 1024) throw new Error(tr('模型超过 128 MB，请减少场景内容', 'The model exceeds the 128 MB limit.'));
    const bytes = new Uint8Array(glb), chunks = [];
    for (let i = 0; i < bytes.length; i += 32768) chunks.push(String.fromCharCode(...bytes.subarray(i, i + 32768)));
    const [width, height] = renderSize();
    return {glb:btoa(chunks.join('')), metadata:{version:2,nativeFurniture,width,height,quality:renderPrefs.quality,
      exposure:renderPrefs.exposure, night:opt.night, hour:opt.hour, ceiling:H, meshCount:count,
      camera:{matrix:session.camera.matrixWorld.toArray(), fov:session.camera.fov, aspect:session.camera.aspect},
      rooms:ROOMS.filter(r => r.at).map(r => ({center:[wx(r.at[0]),H-.08,wz(r.at[1])],area:roomArea(r)})),
      lights:ceilingLightLayout.map(l=>({center:[l.x,H-.035,l.z],area:l.area,size:l.size})),
      sourceName:state.cadPlan?.sourceName || 'CADtour'}, reference:$('#renderImage').src.startsWith('data:') ? $('#renderImage').src : null};
  } finally { materials.forEach(m => m.dispose()); }
}
async function generateCycles(){
  const session = renderSession, task = {controller:new AbortController(),job:null,cancelled:false};
  session.cycles = task; session.blob = null; session.blend = null; renderBusy = true; syncRenderControls();
  renderStatus(tr('正在传送模型和当前镜头…', 'Transferring geometry and camera…'));
  try {
    await paintRenderUI();
    await cyclesJSON('/api/cycles/health');
    const payload = await exportCyclesScene(session);
    if (task.cancelled) throw new DOMException('Cancelled', 'AbortError');
    const created = await cyclesJSON('/api/cycles/jobs', {method:'POST',body:JSON.stringify(payload)});
    task.job = created.id;
    if (task.cancelled){ await fetch(`/api/cycles/jobs/${task.job}`, {method:'DELETE',headers:{'X-CADtour':'1'}}); throw new DOMException('Cancelled', 'AbortError'); }
    while (true){
      const job = await cyclesJSON(`/api/cycles/jobs/${task.job}`, {signal:task.controller.signal});
      if (job.state === 'failed') throw new Error(job.error || 'Blender render failed');
      if (job.state === 'cancelled') throw new DOMException('Cancelled', 'AbortError');
      if (job.state === 'done'){
        const response = await fetch(job.image, {signal:task.controller.signal});
        if (!response.ok) throw new Error('Could not read render result');
        const blob = await response.blob();
        if (session !== renderSession || task.cancelled) return;
        if (session.url) URL.revokeObjectURL(session.url);
        session.blob = blob; session.url = URL.createObjectURL(blob); session.blend = job.blend;
        $('#renderImage').src = session.url;
        const nativeSummary = job.summary?.native_furniture;
        if(nativeSummary?.warnings?.length) toast(nativeSummary.warnings.map(w=>w.message).join(' '));
        const nativeCount=nativeSummary?.instances?.length||0, warningCount=nativeSummary?.warnings?.length||0;
        renderStatus(tr(`Cycles 已完成 · ${job.width} × ${job.height} · ${Math.round(job.elapsed)} 秒`, `Cycles complete · ${job.width} × ${job.height} · ${Math.round(job.elapsed)} s`)
          +(nativeCount?tr(` · ${nativeCount} 个原始 blend 模型`,` · ${nativeCount} native blend models`):'')
          +(warningCount?tr(` · ${warningCount} 张源贴图缺失，已用纯色替代`,` · ${warningCount} missing source textures replaced with plain colours`):'')); break;
      }
      const stages = {
        'Loading native Blender furniture':tr('正在加载原始 Blender 模型','Loading native Blender furniture'),
        'Queued':tr('等待渲染','Queued'),
        'Blender: importing model':tr('Blender 正在导入模型','Blender: importing model'),
        'Importing CAD geometry and materials':tr('正在导入模型和材质','Importing CAD geometry and materials'),
        'Preparing physical materials':tr('正在准备物理材质','Preparing physical materials'),
        'Setting daylight and room lighting':tr('正在设置日照和室内灯光','Setting daylight and room lighting'),
        'Packing textures and saving Blender scene':tr('正在保存 Blender 场景','Packing textures and saving Blender scene'),
        'Cycles path tracing on Metal GPU':tr('Cycles 光线追踪 · Metal GPU','Cycles path tracing on Metal GPU'),
        'Cycles path tracing on OPTIX GPU':tr('Cycles 光线追踪 · NVIDIA OptiX','Cycles path tracing on NVIDIA OptiX'),
        'Cycles path tracing on CUDA GPU':tr('Cycles 光线追踪 · NVIDIA CUDA','Cycles path tracing on NVIDIA CUDA'),
        'Cycles path tracing on HIP GPU':tr('Cycles 光线追踪 · AMD GPU','Cycles path tracing on AMD GPU'),
        'Cycles path tracing on ONEAPI GPU':tr('Cycles 光线追踪 · Intel GPU','Cycles path tracing on Intel GPU'),
        'Cycles path tracing on CPU':tr('Cycles 光线追踪 · CPU','Cycles path tracing on CPU'),
        'Cycles path tracing on CPU fallback':tr('Cycles 光线追踪 · CPU 备用模式','Cycles path tracing on CPU fallback')
      };
      renderStatus(`${stages[job.stage] || job.stage} · ${Math.round(job.elapsed)} ${tr('秒', 's')}`);
      await new Promise((resolve, reject) => {
        const abort = () => { clearTimeout(timer); reject(new DOMException('Cancelled','AbortError')); };
        const timer = setTimeout(() => {task.controller.signal.removeEventListener('abort',abort);resolve();},1000);
        task.controller.signal.addEventListener('abort',abort,{once:true});
        if (task.controller.signal.aborted) abort();
      });
    }
  } catch(err){
    if (session === renderSession) renderStatus(err.name === 'AbortError' ? tr('已取消渲染','Render cancelled') : `${tr('Cycles 渲染失败','Cycles render failed')}: ${err.message}`, err.name !== 'AbortError');
    if (err.name !== 'AbortError') console.error(err);
  } finally {
    session.cycles = null; renderBusy = false;
    if (session === renderSession) syncRenderControls();
  }
}
function shot(){ openRender(); }

function relang(){ syncWalkTexts(); if (inited) buildLabels(); }

window.View3D = {enter, previewAsset, refreshAssets:()=>{sigFurn=null;sync(true);}, prepareSolidWallText, wallModelSize:async type=>type==='wall-tv'?[1000,562.5,80]:type==='wall-mirror'?[1000,750,30]:(await loadFurnitureAsset(type)).size.toArray().map(n=>n*1000), exit, relang, sync:() => sync(), shot, groundAt, placementAt, flyToRoom:id => active && !anim && flyToRoom(id), walking:() => active && opt.mode === 'walk'};
